<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Видеопрокат «Кадр»</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <img src="img/logo.png" alt="Логотип" class="logo">
    <h1>Видеопрокат «Кадр»</h1>
    <nav>
      <a href="index.html">Главная</a>
      <a href="catalog.html" class="active">Каталог</a>
    </nav>
  </header>

  <main class="content">
    <h2>Каталог фильмов</h2>
    <label for="genre">Жанр:</label>
    <select id="genre">
      <option value="all">Все</option>
      <option value="drama">Драма</option>
      <option value="comedy">Комедия</option>
      <option value="fantasy">Фантастика</option>
    </select>

    <table class="films">
      <thead>
        <tr><th>Название</th><th>Год</th><th>Жанр</th><th>Цена за сутки</th></tr>
      </thead>
      <tbody id="films"></tbody>
    </table>
  </main>

  <footer class="footer">
    <p>© 2026 Видеопрокат «Кадр». Учебный проект.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
